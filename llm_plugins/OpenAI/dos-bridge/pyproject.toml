[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dosbox-x-dos-bridge"
version = "1.3.0"
description = "Serialized MCP transport for the DOSBox-X CTTY BRIDGE device"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=1.26,<2"]

[project.scripts]
dos-bridge-mcp = "mcp_server:main"

[tool.setuptools]
py-modules = ["bridge_client", "mcp_server"]

[tool.setuptools.package-dir]
"" = "scripts"
